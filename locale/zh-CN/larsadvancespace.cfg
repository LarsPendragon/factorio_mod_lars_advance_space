[technology-description]
lars-refining-kerosene=从燃料油中分馏出煤油，煤油具有更高的热值和推重比，可以用于火箭燃料
lars-liquid-oxygen-hydroxide=将水电解为氢气和氧气后，低温工厂可以方便的将氢氧液化
angels-pressure-tanks=普通的储液罐无法存储低温液体，需要特殊的工艺支持

lars-air-processor=通过过滤、加压，可以获得高纯的高压空气
lars-cooling-air=通过将空气液化，可以制取液氮和液氧
lars-heat-shield=热屏蔽研究
lars-solid-rocket-fuel=虽然固体火箭燃料可操纵性和可复用性极差，但可以用简单的方式将我们送上太空，开启新的时代
lars-rhodite-process=这种稀有金属可以作为推进剂的催化剂，帮助我们探索更深的太空


[entity-description]
angels-pressure-tank-1=低温压力储罐，可以储存液氧等低温液体，但不能在气压过高的地区使用
lars-air-processor=空气处理机可以对空气进行更精密的操作
lars-rocket-silo-2=可以更高效的将玩家和物品发射到太空

