[mod-setting-description]
lars-fish-spoilage-time-seconds=控制天使鱼类（以及河豚）的变质时间，如果为0则不变质
lars-meat-spoilage-time-seconds=控制天使生肉的变质时间，如果为0则不变质
lars-crop-spoilage-time-seconds=控制天使农作物的变质时间，如果为0则不变质
lars-seed-spoilage-time-seconds=控制天使农作物种子（非休眠）的变质时间，如果为0则不变质
lars-crop-product-spoilage-time-seconds=控制天使农作物产物（如玉米、谷物、水果等）的变质时间，如果为0则不变质