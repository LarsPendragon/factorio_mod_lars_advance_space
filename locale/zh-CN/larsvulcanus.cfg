[fluid-description]
lars-photon=光的基本组成粒子，能以神奇的流体形态存在，但无法用普通的方式存储。如果被存储到储液罐或管道中，会逐渐被罐体和管道吸收
lars-electron=电子以电子束流体的形式发射出来，但无法被存储，会逐渐被管道和储液罐吸收
lars-high-energy-photon=光子的能量和光的频率相关，当加速电子时会自然产生高频的高能光子。高能光子无法被存储，会逐渐被管道和储液罐吸收


