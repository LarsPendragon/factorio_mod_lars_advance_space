[technology-description]
lars-igneous-rock-processing=通过对这种在祝融型上常见岩石的转化，可以让我们建立起新星球上的基础工业体系
lars-foundry=可以从岩浆中提取纯度较低的矿物
lars-rock-change=火成岩可以转变为其他种类的岩石
lars-lava-cooling=用冷却液辅助岩浆的冷却速度，可以高效产出大量火成岩
lars-rock-crush=直接破碎岩石，有很低的概率可以获得矿物
lars-lava-catalyze=在催化剂的帮助下，可以更快速地从岩浆提取熔融金属
lars-photon-catalysator=在太阳能异常丰富的祝融星上，可以将阳光的可见光波段的光子捕获，并与二氧化钛制成特殊的催化剂
lars-photon-storage=硅酸钇是一种特殊的晶体，可以降低穿过其中的光子的速度，达到光存储的效果


